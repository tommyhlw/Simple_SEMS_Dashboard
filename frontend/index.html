<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>13ha Freiheit PV Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #04101f;
        --surf: rgba(255,255,255,0.05);
        --surf-strong: rgba(255,255,255,0.08);
        --text: #f6f8ff;
        --muted: #94a8cf;
        --accent-pv: #f9b229;
        --accent-meter: #56c7ff;
        --accent-house: #4ad68f;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: radial-gradient(circle at top, #0f233a 0%, #020813 60%); color: var(--text); font-family: Inter, system-ui, sans-serif; }
      body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      .screen { width: 80%; max-width: 960px; min-width: 320px; margin: 0 auto; padding: 16px 16px 24px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 10px; }
      .topbar button { width: 42px; height: 42px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.06); color: var(--text); font-size: 1.35rem; display: grid; place-items: center; cursor: pointer; }
      .title-group { text-align: center; flex: 1; }
      .date-card { margin: 0 auto 18px; width: 100%; max-width: 320px; }
      .date-button { width: 100%; display: inline-flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: var(--text); font-size: 1.1rem; }
      .date-button input { background: transparent; border: none; color: inherit; font: inherit; text-align: right; width: 100%; cursor: pointer; }
      .snapshot-mode body { margin: 0; padding: 0; overflow: hidden; }
      .snapshot-mode .screen { width: 960px; max-width: 960px; min-width: 960px; margin: 0 auto; padding: 12px 12px 10px; min-height: 540px; max-height: 540px; overflow: hidden; }
      .snapshot-mode .topbar,
      .snapshot-mode .date-card,
      .snapshot-mode .actions { display: none !important; }
      .snapshot-mode .cards-wrapper { margin-bottom: 12px; }
      .snapshot-mode .cards { gap: 12px; }
      .snapshot-mode .metric-card { padding: 16px; min-height: 128px; }
      .snapshot-mode .chart-card { padding: 14px; }
      .snapshot-mode .chart-meta { margin-bottom: 10px; }
      .snapshot-mode .legend { margin-top: 12px; }
      .snapshot-mode .chart-canvas { aspect-ratio: 16 / 8; max-height: 278px; }
      .title-group h1 { margin: 0; font-size: 2.0rem; letter-spacing: 0.02em; font-weight: 700; }
      .title-group p { margin: 4px 0 0; color: var(--muted); font-size: 1.2rem; }
      .cards-wrapper { overflow: visible; padding-bottom: 0; margin-bottom: 16px; }
      .cards { display: grid; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .metric-card { width: 100%; padding: 22px; min-height: 148px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.05); box-shadow: 0 22px 54px rgba(0,0,0,0.25); backdrop-filter: blur(10px); }
      .metric-card.pv { border-color: rgba(249,178,41,0.85); background: rgba(249,178,41,0.12); }
      .metric-card.meter { border-color: rgba(86,199,255,0.85); background: rgba(86,199,255,0.12); }
      .metric-card.house { border-color: rgba(74,214,143,0.85); background: rgba(74,214,143,0.12); }
      .metric-card strong { display: inline-flex; align-items: center; justify-content: space-between; width: 100%; gap: 10px; text-transform: uppercase; letter-spacing: 0.08em; font-size: 1.45rem; color: var(--text); }
      .metric-card.pv strong { color: var(--accent-pv); }
      .metric-card.meter strong { color: var(--accent-meter); }
      .metric-card.house strong { color: var(--accent-house); }
      .metric-card-header { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
      .metric-icon { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; font-size: 30px; border: 1px solid rgba(255,255,255,0.16); }
      .metric-value { margin-top: 18px; font-size: 2.55rem; font-weight: 800; line-height: 1.05; }
      .metric-card.pv .metric-value { color: var(--accent-pv); }
      .metric-card.meter .metric-value { color: var(--accent-meter); }
      .metric-card.house .metric-value { color: var(--accent-house); }
      .metric-status { margin-top: 8px; font-size: 1.5rem; color: #d1e8ff; display: flex; align-items: center; gap: 10px; justify-content: center; }
      .metric-status span { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; font-size: 1.85rem; }
      .legend-chip { display: inline-flex; align-items: center; gap: 8px; color: #d9e5ff; font-size: 1.1rem; }
      .legend-chip span { width: 14px; height: 14px; border-radius: 5px; display: inline-block; border: 1px solid rgba(255,255,255,0.16); }
      .chart-card { border-radius: 28px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 18px; }
      .chart-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
      .chart-meta .label { color: var(--muted); font-size: 1.17rem; }
      .chart-meta .value { font-size: 1.2rem; font-weight: 600; color: #ffffff; }
      .api-error { margin: 0 0 14px; color: #ffb3a7; font-size: 1rem; }
      .chart-canvas { border-radius: 22px; overflow: hidden; background: #051224; width: 100%; max-width: 100%; aspect-ratio: 18 / 9; max-height: 520px; margin: 0 auto; }
      .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
      .legend-chip { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 1.05rem; }
      .legend-chip span { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
      .legend-chip span { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
      .actions { display: flex; justify-content: center; gap: 18px; margin-top: 18px; flex-wrap: wrap; }
      .action-link { color: var(--muted); text-decoration: none; font-size: 1.2rem; }
      .action-link:hover { text-decoration: underline; }
      @media (max-width: 768px) {
        .screen { padding: 14px 12px 20px; }
        .topbar { gap: 12px; flex-wrap: wrap; }
        .title-group h1 { font-size: 1.5rem; }
        .title-group p { font-size: 0.88rem; }
        .date-card { max-width: 100%; }
        .cards { grid-template-columns: 1fr; }
        .metric-card { padding: 14px; }
        .metric-value { font-size: 1.2rem; }
        .chart-card { padding: 16px; }
        .chart-meta { flex-direction: column; align-items: flex-start; gap: 8px; }
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="topbar">
        <button type="button" aria-label="Menü">☰</button>
        <div class="title-group">
          <h1>SEMS Live</h1>
          <p>Momentane Leistung und Verbrauch</p>
        </div>
        <button type="button" id="refresh-icon" aria-label="Aktualisieren">↻</button>
      </div>

      <div class="date-card">
        <label class="date-button" for="todayDate">
          <span id="date-display">—</span>
          <input id="todayDate" type="date" />
        </label>
      </div>

      <div class="cards-wrapper">
        <div class="cards">
          <div class="metric-card pv" id="card-pv">
            <div class="metric-card-header">
              <strong>PV</strong>
              <div class="metric-icon" style="background: rgba(249,178,41,0.14); color: var(--accent-pv);">☀️</div>
            </div>
            <div class="metric-value" id="val-pv">— kW</div>
          </div>
          <div class="metric-card meter" id="card-meter">
            <div class="metric-card-header">
              <strong>Zähler</strong>
              <div class="metric-icon" style="background: rgba(86,199,255,0.14); color: var(--accent-meter);">⚡</div>
            </div>
            <div class="metric-value" id="val-meter">— kW</div>
            <div class="metric-status" id="meter-status"><span>😕</span>Warte auf Messwert</div>
          </div>
          <div class="metric-card house" id="card-house">
            <div class="metric-card-header">
              <strong>Haus</strong>
              <div class="metric-icon" style="background: rgba(74,214,143,0.14); color: var(--accent-house);">🏠</div>
            </div>
            <div class="metric-value" id="val-house">— kW</div>
          </div>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-meta">
          <div class="label">Tagesverlauf</div>
          <div class="value" id="val-time">Letzter Messwert: —</div>
        </div>
        <div class="chart-canvas">
          <canvas id="pvChart"></canvas>
        </div>
        <div class="legend">
          <span class="legend-chip"><span style="background: var(--accent-pv)"></span>PV</span>
          <span class="legend-chip"><span style="background: var(--accent-meter)"></span>Zähler</span>
          <span class="legend-chip"><span style="background: var(--accent-house)"></span>Haus</span>
        </div>
      </div>
      <p id="api-error" class="api-error" role="alert" hidden></p>

      <div class="actions">
        <a href="#" id="export-csv" class="action-link">CSV exportieren</a>
        <a href="#" id="refresh-link" class="action-link">Aktualisieren</a>
      </div>
    </div>

    <script>
      const dateInput = document.getElementById('todayDate');
      const dateDisplay = document.getElementById('date-display');
      const params = new URLSearchParams(window.location.search);
      const snapshotMode = params.get('snapshot') === '1';
      const today = new Date().toISOString().split('T')[0];
      const requestedDate = params.get('target_date') || today;
      const initialDate = requestedDate.match(/^\d{4}-\d{2}-\d{2}$/) ? requestedDate : today;
      if (snapshotMode) document.documentElement.classList.add('snapshot-mode');
      dateInput.value = initialDate;
      dateDisplay.textContent = new Date(initialDate).toLocaleDateString('de-DE');
      const refreshIcon = document.getElementById('refresh-icon');
      const refreshLink = document.getElementById('refresh-link');
      const exportLink = document.getElementById('export-csv');
      const timeLabel = document.getElementById('val-time');
      const apiError = document.getElementById('api-error');
      const valPV = document.getElementById('val-pv');
      const valMeter = document.getElementById('val-meter');
      const valHouse = document.getElementById('val-house');
      const meterStatus = document.getElementById('meter-status');
      let chart = null;
      let latestPCData = null;

      async function loadJSON(url) {
        const response = await fetch(url);
        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          throw new Error(error.detail || 'SEMS+-Daten konnten nicht geladen werden.');
        }
        return response.json();
      }

      async function loadPC(date) {
        const query = new URLSearchParams({ target_date: date });
        return loadJSON(window.location.origin + '/api/pc_all?' + query);
      }

      async function loadNow() {
        return loadJSON(window.location.origin + '/api/pc_now');
      }

      function createChart(labels, pvData, meterData, houseData) {
        const ctx = document.getElementById('pvChart').getContext('2d');
        const isMobile = window.innerWidth <= 480;
        const toTimePoints = (values) => values.flatMap((value, index) => {
          const match = String(labels[index] || '').match(/^(\d{1,2}):(\d{2})/);
          if (!match) return [];
          const hour = Number(match[1]);
          const minute = Number(match[2]);
          if (hour < 0 || hour > 23 || minute < 0 || minute > 59) return [];
          return [{ x: hour + minute / 60, y: value }];
        });
        const datasets = [
          { label: 'PV (kW)', data: toTimePoints(pvData), borderColor: 'rgba(251,176,59,1)', backgroundColor: 'rgba(251,176,59,0.16)', fill: true, tension: 0.28, pointRadius: labels.length === 1 ? 5 : 0 },
          { label: 'Zähler (kW)', data: toTimePoints(meterData), borderColor: 'rgba(86,199,255,1)', backgroundColor: 'rgba(86,199,255,0.14)', fill: false, tension: 0.28, pointRadius: labels.length === 1 ? 5 : 0 },
          { label: 'Haus (kW)', data: toTimePoints(houseData), borderColor: 'rgba(74,214,143,1)', backgroundColor: 'rgba(74,214,143,0.12)', fill: false, tension: 0.28, pointRadius: labels.length === 1 ? 5 : 0 }
        ];
        if (chart) {
          chart.data.datasets = datasets;
          chart.update();
          return;
        }
        chart = new Chart(ctx, {
          type: 'line',
          data: { datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            layout: { padding: 0 },
            plugins: { legend: { display: false } },
            scales: {
              x: {
                type: 'linear',
                min: 0,
                max: 23 + 59 / 60,
                afterBuildTicks: (axis) => {
                  axis.ticks = Array.from({ length: 24 }, (_, hour) => ({ value: hour }));
                },
                grid: { color: 'rgba(255,255,255,0.06)' },
                ticks: {
                  color: '#9fb4d8',
                  font: { size: isMobile ? 10 : 13 },
                  stepSize: 1,
                  autoSkip: false,
                  callback: (value) => Number.isInteger(value) ? String(value) : ''
                },
                bounds: 'data',
                title: { display: true, text: 'Uhrzeit', color: '#9fb4d8', font: { size: isMobile ? 14 : 18, weight: '600' } }
              },
              y: {
                grid: { color: 'rgba(255,255,255,0.06)' },
                ticks: { color: '#9fb4d8', maxTicksLimit: isMobile ? 6 : 10, font: { size: isMobile ? 18 : 22 } },
                title: { display: true, text: 'kW', color: '#9fb4d8', font: { size: isMobile ? 20 : 24, weight: '600' } }
              }
            }
          }
        });
        window.chart = chart;
      }

      function updateCards(json) {
        const labels = json?.pv?.labels || [];
        const pvData = json?.pv?.data || [];
        const meterData = json?.meter?.data || [];
        const houseData = json?.house?.data || [];
        const lastPV = pvData.length ? pvData[pvData.length - 1] : null;
        const lastMeter = meterData.length ? meterData[meterData.length - 1] : null;
        const lastHouse = houseData.length ? houseData[houseData.length - 1] : null;
        const lastTime = labels.length ? labels[labels.length - 1] : '—';

        valPV.textContent = lastPV != null ? lastPV + ' kW' : '— kW';
        valMeter.textContent = lastMeter != null ? lastMeter + ' kW' : '— kW';
        valHouse.textContent = lastHouse != null ? lastHouse + ' kW' : '— kW';
        timeLabel.textContent = 'Letzter Messwert: ' + lastTime;
        updateMeterStatus(lastMeter);
      }

      function updateMeterStatus(meter) {
        if (meter == null) {
          meterStatus.innerHTML = '<span>😕</span>keine Daten';
        } else if (meter > 0) {
          meterStatus.innerHTML = '<span>😎</span>Netzeinspeisung';
        } else if (meter < 0) {
          meterStatus.innerHTML = '<span>😢</span>Netzbezug';
        } else {
          meterStatus.innerHTML = '<span>😕</span>keine Daten';
        }
      }

      function updateChart(json) {
        const labels = json?.pv?.labels || json?.meter?.labels || [];
        createChart(labels, json?.pv?.data || [], json?.meter?.data || [], json?.house?.data || []);
      }

      async function refreshAndRender(date = dateInput.value) {
        const [dailyResult, currentResult] = await Promise.allSettled([loadPC(date), loadNow()]);
        if (currentResult.status === 'fulfilled') {
          updateCards(currentResult.value);
        } else {
          valPV.textContent = '— kW';
          valMeter.textContent = '— kW';
          valHouse.textContent = '— kW';
          timeLabel.textContent = 'Letzter Messwert: —';
          meterStatus.innerHTML = '<span>😕</span>keine Daten';
        }
        if (dailyResult.status === 'fulfilled') {
          latestPCData = dailyResult.value;
          updateChart(dailyResult.value);
        } else {
          latestPCData = null;
          updateChart(null);
        }

        const errors = [...new Set([dailyResult, currentResult]
          .filter((result) => result.status === 'rejected')
          .map((result) => result.reason instanceof Error ? result.reason.message : 'SEMS+-Daten konnten nicht geladen werden.'))];
        apiError.textContent = errors.join(' ');
        apiError.hidden = errors.length === 0;
      }

      async function exportCSV() {
        const data = latestPCData || await loadPC(dateInput.value);
        if (!data) return;
        const source = data;
        const pvLabels = source?.pv?.labels || [];
        const meterLabels = source?.meter?.labels || [];
        const houseLabels = source?.house?.labels || [];
        const pvData = source?.pv?.data || [];
        const meterData = source?.meter?.data || [];
        const houseData = source?.house?.data || [];

        const makeMap = (labels, values) => labels.reduce((map, label, index) => {
          if (label != null && label !== '') {
            map[String(label)] = values[index] ?? '';
          }
          return map;
        }, {});

        const pvMap = makeMap(pvLabels, pvData);
        const meterMap = makeMap(meterLabels, meterData);
        const houseMap = makeMap(houseLabels, houseData);
        const allLabels = Array.from(new Set([...pvLabels, ...meterLabels, ...houseLabels])).filter((label) => label != null && label !== '');

        if (!allLabels.length) return;

        const csvRows = [
          ['label', 'pv', 'meter', 'house'],
          ...allLabels.map((label) => [
            String(label),
            pvMap[String(label)] ?? '',
            meterMap[String(label)] ?? '',
            houseMap[String(label)] ?? ''
          ])
        ];

        const csvText = csvRows.map((row) => row.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
        const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'pc_values_' + dateInput.value + '.csv';
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(link.href);
      }

      dateInput.addEventListener('change', () => {
        dateDisplay.textContent = new Date(dateInput.value).toLocaleDateString('de-DE');
        refreshAndRender(dateInput.value);
      });
      refreshIcon.addEventListener('click', () => refreshAndRender(dateInput.value));
      refreshLink.addEventListener('click', (event) => { event.preventDefault(); refreshAndRender(dateInput.value); });
      exportLink.addEventListener('click', async (event) => { event.preventDefault(); await exportCSV(); });

      refreshAndRender(initialDate);
    </script>
  </body>
</html>
